version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sejour_senegal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sejour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sejourpassword}
      POSTGRES_DB: ${POSTGRES_DB:-sejoursenegal}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sejour}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sejour_senegal_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sejour}:${POSTGRES_PASSWORD:-sejourpassword}@postgres:5432/${POSTGRES_DB:-sejoursenegal}
      JWT_SECRET: ${JWT_SECRET:-change-in-production-32chars-minimum}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYTECH_API_KEY: ${PAYTECH_API_KEY}
      PAYTECH_API_SECRET: ${PAYTECH_API_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@sejoursenegal.sn}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sejour_senegal_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api/v1}
    ports:
      - '80:80'

volumes:
  postgres_data:
  uploads_data:
